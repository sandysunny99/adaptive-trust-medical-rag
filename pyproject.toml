[project]
name = "adaptive-trust-medical-rag"
version = "0.1.0"
description = "Adaptive Trust-Aware Medical RAG: Mitigating Prompt Injection and Retrieval Hallucinations"
readme = "README.md"
requires-python = ">=3.12, <3.13"
license = { text = "MIT" }

# ============================================================
# Dependencies are added incrementally using: uv add <pkg>==<ver>
# NEVER install directly with pip into the project environment.
# ALL installs go through uv to maintain uv.lock reproducibility.
# ============================================================
dependencies = [
    "fastapi>=0.141.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "sqlalchemy[asyncio]>=2.0.52",
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "psycopg2-binary>=2.9.12",
    "pgvector>=0.5.0",
    "pyyaml>=6.0.3",
    "httpx>=0.24",
]

# Phase 8:  uv add google-genai openai
# Phase 9:  uv add rank_bm25
# Phase 10: uv add sentence-transformers spacy scispacy
# Phase 19: uv add neo4j
# Phase 20: uv add ragas deepeval mlflow
# Phase 22: uv add garak

[project.optional-dependencies]
dev = [
    # Added at Phase 4 via: uv add --dev bandit ruff pytest pytest-asyncio
]


[project.scripts]
medical-rag = "adaptive_trust_medical_rag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Hatchling build config — stub project (no src/ directory yet)
# src/adaptive_trust_medical_rag/ will be created at Phase 8
[tool.hatch.build.targets.wheel]
packages = ["src/adaptive_trust_medical_rag"]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "pytest>=9.1.1",
    # Added at Phase 4 via: uv add --group dev bandit ruff pytest pytest-asyncio
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "S", "B", "A"]
ignore = ["S101", "S603", "S607"]  # S101: assert; S603/S607: controlled subprocess in hook scripts

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "N"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["live: marks tests requiring live LLM provider network connection"]
testpaths = ["tests"]
pythonpath = ["src"]
log_cli = true
log_cli_level = "INFO"

[tool.bandit]
exclude_dirs = [".venv", "tests", "evaluation"]
skips = ["B101", "B105", "B311", "B404", "B603", "B607"]
