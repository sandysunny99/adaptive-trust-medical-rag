name: Trivy Supply Chain Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run weekly on Monday 02:00 UTC
    - cron: '0 2 * * 1'

permissions:
  contents: read
  security-events: write  # Upload SARIF results to GitHub Security tab

jobs:
  trivy-scan:
    name: Trivy SBOM + Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Run Trivy filesystem scan (SARIF)
        uses: aquasecurity/trivy-action@18f2505d6f68ebe54d851a4437a9ddc32e5bfef8  # v0.29.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'   # Don't fail build yet — report only until Phase 4

      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@1b549b9259bda1cb5ddde3b41741a82a2d15a841  # v3.28.13
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Generate SBOM (SPDX JSON)
        uses: aquasecurity/trivy-action@18f2505d6f68ebe54d851a4437a9ddc32e5bfef8  # v0.29.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'spdx-json'
          output: 'sbom.spdx.json'

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08  # v4.6.0
        with:
          name: sbom-spdx
          path: sbom.spdx.json
          retention-days: 90
