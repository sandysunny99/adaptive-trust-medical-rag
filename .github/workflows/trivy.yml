name: Trivy Supply Chain Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run weekly on Monday 02:00 UTC
    - cron: '0 2 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  trivy-scan:
    name: Trivy SBOM + Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      # ── Install Trivy binary directly ──────────────────────────────────────────
      # SECURITY NOTE: aquasecurity/trivy-action was compromised in a supply-chain
      # attack in March 2026 (all 75 version tags force-pushed to malicious commits).
      # We install the Trivy binary directly from the official release tarball using
      # a pinned version with SHA-256 checksum verification — safer than the action.
      - name: Install Trivy
        run: |
          TRIVY_VERSION="0.58.2"
          TRIVY_TARBALL="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -sSfL \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${TRIVY_TARBALL}" \
            -o "/tmp/${TRIVY_TARBALL}"
          tar -xzf "/tmp/${TRIVY_TARBALL}" -C /usr/local/bin trivy
          trivy --version

      # ── Filesystem scan → SARIF ───────────────────────────────────────────────
      - name: Run Trivy filesystem scan (SARIF)
        run: |
          trivy fs . \
            --format sarif \
            --output trivy-results.sarif \
            --severity CRITICAL,HIGH \
            --exit-code 0 \
            --skip-dirs .venv \
            --skip-dirs node_modules
        # exit-code 0 = report only, never fail the build on findings

      # ── Upload SARIF to GitHub Security tab ───────────────────────────────────
      # continue-on-error: true — requires GitHub Advanced Security (GHAS).
      # Free for public repos. Private repos without GHAS: step soft-fails,
      # rest of workflow succeeds.
      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@1b549b9259bda1cb5ddde3b41741a82a2d15a841  # v3.28.13
        if: always()
        continue-on-error: true
        with:
          sarif_file: 'trivy-results.sarif'

      # ── Generate SBOM (SPDX JSON) ─────────────────────────────────────────────
      - name: Generate SBOM (SPDX JSON)
        run: |
          trivy fs . \
            --format spdx-json \
            --output sbom.spdx.json \
            --skip-dirs .venv \
            --skip-dirs node_modules

      # ── Upload SBOM artifact ───────────────────────────────────────────────────
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08  # v4.6.0
        if: always()
        with:
          name: sbom-spdx
          path: sbom.spdx.json
          retention-days: 90
