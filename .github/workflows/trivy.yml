name: Trivy Supply Chain Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run weekly on Monday 02:00 UTC
    - cron: '0 2 * * 1'

permissions:
  contents: read
  security-events: write  # Required for SARIF upload to GitHub Security tab

jobs:
  trivy-scan:
    name: Trivy SBOM + Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      # ── Trivy filesystem scan → SARIF ─────────────────────────────────────
      - name: Run Trivy filesystem scan (SARIF)
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe  # v0.30.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'   # Report only — do not fail the build on findings
          skip-dirs: '.venv,node_modules'

      # ── Upload SARIF to GitHub Security tab ───────────────────────────────
      # continue-on-error: true — SARIF upload requires GitHub Advanced Security
      # (free for public repos; paid for private). If GHAS is unavailable this
      # step will soft-fail while the rest of the workflow still passes.
      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@1b549b9259bda1cb5ddde3b41741a82a2d15a841  # v3.28.13
        if: always()
        continue-on-error: true
        with:
          sarif_file: 'trivy-results.sarif'

      # ── Generate SBOM (SPDX JSON) ─────────────────────────────────────────
      - name: Generate SBOM (SPDX JSON)
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe  # v0.30.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'spdx-json'
          output: 'sbom.spdx.json'
          skip-dirs: '.venv,node_modules'

      # ── Upload SBOM artifact ───────────────────────────────────────────────
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08  # v4.6.0
        if: always()
        with:
          name: sbom-spdx
          path: sbom.spdx.json
          retention-days: 90
