name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────────────────────────
  # Job 1: Lint, security scans, and full unit-test suite
  # ──────────────────────────────────────────────────────────────────
  lint-and-test:
    name: Lint, Scan & Unit Tests
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "postgresql+asyncpg://u:p@localhost/db"
      PYTHONPATH: "src"
      GITHUB_ACTIONS: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv==0.12.5

      - name: Install dependencies
        run: uv sync --frozen

      - name: Install Gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks

      - name: Gitleaks secret scan
        run: gitleaks detect --source . --no-git --config .gitleaks.toml --redact --exit-code 1

      - name: Ruff lint
        run: |
          source .venv/bin/activate
          ruff check src/ tests/ .agents/scripts/
          if [ -d alembic ]; then ruff check alembic/; fi

      - name: Unit tests
        run: |
          source .venv/bin/activate
          mkdir -p reports
          pytest tests/ -v --tb=short --junit-xml=reports/junit.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-report
          path: reports/junit.xml
          retention-days: 30

      - name: Hook inject_medical_context
        run: |
          source .venv/bin/activate
          out=$(echo '{}' | python .agents/scripts/inject_medical_context.py)
          echo "$out" | python -c "import sys,json; assert 'injectSteps' in json.load(sys.stdin)"

      - name: Hook check_dangerous_cmd allow
        run: |
          source .venv/bin/activate
          r=$(echo '{"CommandLine":"git status"}' | python .agents/scripts/check_dangerous_cmd.py)
          echo "$r" | python -c "import sys,json; assert json.load(sys.stdin)['decision']=='allow'"

      - name: Hook check_dangerous_cmd deny
        run: |
          source .venv/bin/activate
          DENY_CMD=$(python -c "import json; print(json.dumps({'CommandLine': 'rm' + ' -rf /'}))")
          r=$(echo "$DENY_CMD" | python .agents/scripts/check_dangerous_cmd.py)
          echo "$r" | python -c "import sys,json; assert json.load(sys.stdin)['decision']=='deny'"

      - name: Hook pre_commit_secret_scan allow
        run: |
          source .venv/bin/activate
          r=$(echo '{"CodeContent":"x = 1 + 2"}' | python .agents/scripts/pre_commit_secret_scan.py)
          echo "$r" | python -c "import sys,json; assert json.load(sys.stdin)['decision']=='allow'"

      - name: Hook pre_commit_secret_scan deny
        run: |
          source .venv/bin/activate
          p=$(python -c 'import json; print(json.dumps({"CodeContent":"token = "+"ghp_"+"0"*36}))')
          r=$(echo "$p" | python .agents/scripts/pre_commit_secret_scan.py)
          echo "$r" | python -c "import sys,json; assert json.load(sys.stdin)['decision']=='deny'"

      - name: Verify Alembic migration chain
        run: |
          source .venv/bin/activate
          python -c "
          from adaptive_trust_medical_rag.database.migration_utils import (
              verify_migration_chain, get_migration_chain
          )
          errors = verify_migration_chain()
          assert errors == [], f'Migration chain errors: {errors}'
          chain = get_migration_chain()
          assert len(chain) >= 1, 'Empty migration chain'
          print(f'Migration chain OK: {chain}')
          "

      - name: API health endpoint smoke test
        run: |
          source .venv/bin/activate
          python -c "
          from fastapi.testclient import TestClient
          from adaptive_trust_medical_rag.api.app import create_app
          app = create_app()
          client = TestClient(app)
          resp = client.get('/health')
          assert resp.status_code == 200, f'Health check failed: {resp.status_code}'
          data = resp.json()
          assert 'status' in data
          assert 'version' in data
          print(f'API health: {data["status"]} v{data["version"]}')
          "

  # ──────────────────────────────────────────────────────────────────
  # Job 2: Smoke ablation evaluation (every PR + push)
  # MockVariantPipeline only — no live LLM or DB.
  # ──────────────────────────────────────────────────────────────────
  smoke-eval:
    name: Smoke Ablation Evaluation
    runs-on: ubuntu-latest
    needs: lint-and-test

    env:
      DATABASE_URL: "postgresql+asyncpg://u:p@localhost/db"
      PYTHONPATH: "src"
      GITHUB_ACTIONS: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv==0.12.5

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run smoke ablation (variants B + F)
        run: |
          source .venv/bin/activate
          python -c "
          from pathlib import Path
          from adaptive_trust_medical_rag.evaluation.eval_pipeline import run_evaluation
          from adaptive_trust_medical_rag.evaluation.evaluator import DatasetSplit
          from adaptive_trust_medical_rag.evaluation.experiment_tracker import (
              AblationVariant, ExperimentTracker
          )
          reports_dir = Path('ci-reports/smoke')
          logs_dir = Path('ci-reports/logs')
          reports_dir.mkdir(parents=True, exist_ok=True)
          logs_dir.mkdir(parents=True, exist_ok=True)
          result = run_evaluation(
              split=DatasetSplit.smoke,
              variants=[AblationVariant.B, AblationVariant.F],
              tracker=ExperimentTracker(experiment_name='ci-smoke', log_dir=logs_dir),
              reports_dir=reports_dir,
              logs_dir=logs_dir,
              bootstrap=False,
              experiment_name='ci-smoke-ablation',
          )
          vr_f = result.report.get_variant(AblationVariant.F)
          vr_b = result.report.get_variant(AblationVariant.B)
          print(result.report.summary_table())
          assert vr_f.faithfulness > vr_b.faithfulness, (
              f'EVAL REGRESSION: F={vr_f.faithfulness:.4f} <= B={vr_b.faithfulness:.4f}'
          )
          print('Smoke eval PASSED')
          "

      - name: Upload smoke eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-eval-report
          path: ci-reports/smoke/
          retention-days: 30

  # ──────────────────────────────────────────────────────────────────
  # Job 3: Dev dataset full ablation (push to main only)
  # Full 6-variant run on 100-case dev fixture. Bootstrap CI enabled.
  # Research integrity: dev != frozen test set.
  # ──────────────────────────────────────────────────────────────────
  dev-eval:
    name: Dev Dataset Ablation (main only)
    runs-on: ubuntu-latest
    needs: smoke-eval
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    env:
      DATABASE_URL: "postgresql+asyncpg://u:p@localhost/db"
      PYTHONPATH: "src"
      GITHUB_ACTIONS: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv==0.12.5

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run full 6-variant ablation on dev dataset
        run: |
          source .venv/bin/activate
          python -c "
          from pathlib import Path
          from adaptive_trust_medical_rag.evaluation.eval_pipeline import run_evaluation
          from adaptive_trust_medical_rag.evaluation.evaluator import DatasetSplit
          from adaptive_trust_medical_rag.evaluation.experiment_tracker import (
              AblationVariant, ExperimentTracker
          )
          reports_dir = Path('ci-reports/dev')
          logs_dir = Path('ci-reports/logs')
          reports_dir.mkdir(parents=True, exist_ok=True)
          logs_dir.mkdir(parents=True, exist_ok=True)
          result = run_evaluation(
              split=DatasetSplit.dev,
              tracker=ExperimentTracker(experiment_name='ci-dev', log_dir=logs_dir),
              reports_dir=reports_dir,
              logs_dir=logs_dir,
              bootstrap=True,
              experiment_name='ci-dev-ablation',
          )
          vr_f = result.report.get_variant(AblationVariant.F)
          vr_a = result.report.get_variant(AblationVariant.A)
          print(result.report.summary_table())
          deltas = result.report.improvement_over_baseline('mean_faithfulness')
          for var, d in sorted(deltas.items()):
              print(f'  {var}: {"+" if d>=0 else ""}{d:.4f}')
          assert vr_f.faithfulness > vr_a.faithfulness, (
              f'REGRESSION: F={vr_f.faithfulness:.4f} <= A={vr_a.faithfulness:.4f}'
          )
          assert vr_f.robustness_score > vr_a.robustness_score, (
              'REGRESSION: Full arch not more robust than vanilla LLM'
          )
          print(f'Dev eval PASSED ({result.total_cases} cases, {result.n_variants} variants)')
          "

      - name: Upload dev eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-eval-report-${{ github.sha }}
          path: ci-reports/dev/
          retention-days: 90
