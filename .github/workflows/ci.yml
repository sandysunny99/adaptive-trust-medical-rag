name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  lint-and-scan:
    name: Lint and Test
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "postgresql+asyncpg://u:p@localhost/db"
      PYTHONPATH: "src"

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2f
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv==0.12.5

      - name: Install dependencies
        run: uv sync --frozen

      - name: Install Gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz -C /usr/local/bin gitleaks

      - name: Gitleaks secret scan
        run: gitleaks detect --source . --no-git --config .gitleaks.toml --redact --exit-code 1

      - name: Ruff lint
        run: |
          source .venv/bin/activate
          ruff check src/ tests/ alembic/ .agents/scripts/

      - name: Unit tests
        run: |
          source .venv/bin/activate
          pytest tests/ -v --tb=short

      - name: Hook inject_medical_context
        run: |
          source .venv/bin/activate
          out=$(echo '{}' | python .agents/scripts/inject_medical_context.py)
          echo "$out" | python -c "import sys,json; assert 'injectSteps' in json.load(sys.stdin)"

      - name: Hook check_dangerous_cmd allow
        run: |
          source .venv/bin/activate
          r=$(echo '{"CommandLine":"git status"}' | python .agents/scripts/check_dangerous_cmd.py)
          echo "$r" | python -c "import sys,json; assert json.load(sys.stdin)['decision']=='allow'"

      - name: Hook check_dangerous_cmd deny
        run: |
          source .venv/bin/activate
          r=$(printf '{"CommandLine":"rm -rf /"}' | python .agents/scripts/check_dangerous_cmd.py)
          echo "$r" | python -c "import sys,json; assert json.load(sys.stdin)['decision']=='deny'"

      - name: Hook pre_commit_secret_scan allow
        run: |
          source .venv/bin/activate
          r=$(echo '{"CodeContent":"x = 1 + 2"}' | python .agents/scripts/pre_commit_secret_scan.py)
          echo "$r" | python -c "import sys,json; assert json.load(sys.stdin)['decision']=='allow'"

      - name: Hook pre_commit_secret_scan deny
        run: |
          source .venv/bin/activate
          p=$(python -c 'import json; print(json.dumps({"CodeContent":"token = "+"ghp_"+"0"*36}))')
          r=$(echo "$p" | python .agents/scripts/pre_commit_secret_scan.py)
          echo "$r" | python -c "import sys,json; assert json.load(sys.stdin)['decision']=='deny'"
