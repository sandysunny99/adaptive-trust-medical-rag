name: CI — Lint & Secret Scan

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  lint-and-scan:
    name: Lint + Secrets + Tests
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "postgresql+asyncpg://u:p@localhost/db"
      PYTHONPATH: "src"

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2f  # v5.3.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "pydantic>=2.0" \
            "pydantic-settings>=2.0" \
            "sqlalchemy[asyncio]>=2.0" \
            "alembic>=1.0" \
            "asyncpg>=0.28" \
            "fastapi>=0.100" \
            "python-dotenv>=1.0" \
            "pyyaml>=6.0" \
            "httpx>=0.24" \
            "pgvector>=0.2" \
            "pytest>=7.0" \
            "pytest-asyncio>=0.21" \
            "ruff>=0.1"

      - name: Install Gitleaks
        run: |
          curl -sSfL \
            https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks

      - name: Gitleaks secret scan
        run: gitleaks detect --source . --no-git --config .gitleaks.toml --redact --exit-code 1

      - name: Ruff lint
        run: python -m ruff check src/ tests/ alembic/ .agents/scripts/

      - name: Unit tests
        run: python -m pytest tests/ -v --tb=short

      - name: Hook — inject_medical_context
        run: |
          out=$(echo '{}' | python .agents/scripts/inject_medical_context.py)
          echo "$out" | python -c "import sys,json; assert 'injectSteps' in json.load(sys.stdin)"
          echo "OK"

      - name: Hook — check_dangerous_cmd allow
        run: |
          r=$(echo '{"CommandLine":"git status"}' | python .agents/scripts/check_dangerous_cmd.py)
          echo "$r" | python -c "import sys,json; assert json.load(sys.stdin)['decision']=='allow'"
          echo "OK"

      - name: Hook — check_dangerous_cmd deny
        run: |
          r=$(echo '{"CommandLine":"rm -rf /"}' | python .agents/scripts/check_dangerous_cmd.py)
          echo "$r" | python -c "import sys,json; assert json.load(sys.stdin)['decision']=='deny'"
          echo "OK"

      - name: Hook — pre_commit_secret_scan allow
        run: |
          r=$(echo '{"CodeContent":"x = 1 + 2"}' | python .agents/scripts/pre_commit_secret_scan.py)
          echo "$r" | python -c "import sys,json; assert json.load(sys.stdin)['decision']=='allow'"
          echo "OK"

      - name: Hook — pre_commit_secret_scan deny token
        run: |
          p=$(python -c 'import json; print(json.dumps({"CodeContent":"token = "+"ghp_"+"0"*36}))')
          r=$(echo "$p" | python .agents/scripts/pre_commit_secret_scan.py)
          echo "$r" | python -c "import sys,json; assert json.load(sys.stdin)['decision']=='deny'"
          echo "OK"
