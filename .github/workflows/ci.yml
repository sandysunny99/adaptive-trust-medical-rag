name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  # Job 1 - Lint, security scans, full unit-test suite (every push/PR)
  lint-and-test:
    name: Lint, Scan & Unit Tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql+asyncpg://u:p@localhost/db"
      PYTHONPATH: "src"
      GITHUB_ACTIONS: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv==0.12.5

      - name: Install dependencies
        run: uv sync --frozen

      - name: Install Gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz -C /usr/local/bin gitleaks

      - name: Gitleaks secret scan
        run: gitleaks detect --source . --no-git --config .gitleaks.toml --redact --exit-code 1

      - name: Bandit SAST scan
        run: |
          source .venv/bin/activate
          python .agents/scripts/ci/run_bandit.py

      - name: Ruff lint
        run: |
          source .venv/bin/activate
          ruff check src/ tests/ .agents/scripts/
          if [ -d alembic ]; then ruff check alembic/; fi

      - name: Unit tests
        run: |
          source .venv/bin/activate
          mkdir -p reports
          pytest tests/ -v --tb=short --junit-xml=reports/junit.xml

      - name: Upload JUnit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-report
          path: reports/junit.xml
          retention-days: 30

      - name: Hook - inject_medical_context
        run: |
          source .venv/bin/activate
          python .agents/scripts/ci/check_medical_context_hook.py

      - name: Hook - check_dangerous_cmd allow
        run: |
          source .venv/bin/activate
          python .agents/scripts/ci/check_hook_allow.py

      - name: Hook - check_dangerous_cmd deny
        run: |
          source .venv/bin/activate
          python .agents/scripts/ci/check_hook_deny.py

      - name: Hook - pre_commit_secret_scan allow
        run: |
          source .venv/bin/activate
          python .agents/scripts/ci/check_secret_scan_allow.py

      - name: Hook - pre_commit_secret_scan deny
        run: |
          source .venv/bin/activate
          python .agents/scripts/ci/check_secret_scan_deny.py

      - name: Verify Alembic migration chain
        run: |
          source .venv/bin/activate
          python .agents/scripts/ci/check_migration_chain.py

      - name: API health endpoint smoke test
        run: |
          source .venv/bin/activate
          python .agents/scripts/ci/check_api_health.py

  # Job 2 - Smoke ablation evaluation (every push/PR, needs: lint-and-test)
  # Uses MockVariantPipeline only - no live LLM or database required.
  smoke-eval:
    name: Smoke Ablation Evaluation
    runs-on: ubuntu-latest
    needs: lint-and-test
    env:
      DATABASE_URL: "postgresql+asyncpg://u:p@localhost/db"
      PYTHONPATH: "src"
      GITHUB_ACTIONS: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv==0.12.5

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run smoke ablation (Variants B + F, 20 cases)
        run: |
          source .venv/bin/activate
          python .agents/scripts/ci/run_smoke_eval.py

      - name: Upload smoke eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-eval-report
          path: ci-reports/smoke/
          retention-days: 30

  # Job 3 - Dev dataset full ablation (push to main only, needs: smoke-eval)
  # Full 6-variant run with bootstrap CI (N=1000). Dev != frozen test set.
  dev-eval:
    name: Dev Dataset Ablation (main only)
    runs-on: ubuntu-latest
    needs: smoke-eval
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      DATABASE_URL: "postgresql+asyncpg://u:p@localhost/db"
      PYTHONPATH: "src"
      GITHUB_ACTIONS: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv==0.12.5

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run full 6-variant ablation on dev dataset (100 cases)
        run: |
          source .venv/bin/activate
          python .agents/scripts/ci/run_dev_eval.py

      - name: Upload dev eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-eval-report-${{ github.sha }}
          path: ci-reports/dev/
          retention-days: 90
