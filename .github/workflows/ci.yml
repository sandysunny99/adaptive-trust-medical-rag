name: CI — Lint & Secret Scan

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# Minimal permissions — least privilege
permissions:
  contents: read

jobs:
  lint-and-scan:
    name: Ruff Lint + Secret Scan + Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (no persist-credentials)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2f  # v5.3.0
        with:
          python-version: '3.12'

      # ── Install uv ───────────────────────────────────────────────────────────
      - name: Install uv
        uses: astral-sh/setup-uv@f0ec1fc3b38f5e7cd731bb6ce540c5af426746bb  # v5.4.1
        with:
          version: "0.12.5"
          enable-cache: true

      - name: Install project dependencies (locked)
        run: uv sync --frozen

      # ── Secret Scanning ──────────────────────────────────────────────────────
      - name: Install Gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Gitleaks secret scan
        # Uses .gitleaks.toml to exclude .venv/ and other FP-prone paths
        run: gitleaks detect --source . --no-git --config .gitleaks.toml --redact --exit-code 1

      # ── Python Linting (full repo) ───────────────────────────────────────────
      - name: Ruff lint — agents scripts
        run: uv run ruff check .agents/scripts/

      - name: Ruff lint — src & tests
        run: uv run ruff check src/ tests/ alembic/

      # ── Unit Tests ───────────────────────────────────────────────────────────
      - name: Run unit tests
        env:
          DATABASE_URL: "postgresql+asyncpg://u:p@localhost/db"
        run: uv run pytest tests/ -v --tb=short

      # ── Hook script smoke tests ──────────────────────────────────────────────
      - name: Test inject_medical_context.py
        run: |
          output=$(echo '{}' | python .agents/scripts/inject_medical_context.py)
          echo "$output" | python -c "import sys,json; d=json.load(sys.stdin); assert 'injectSteps' in d, 'Missing injectSteps'"
          echo "inject_medical_context.py OK"

      - name: Test check_dangerous_cmd.py — allow safe command
        run: |
          result=$(echo '{"CommandLine": "git status"}' | python .agents/scripts/check_dangerous_cmd.py)
          echo "$result" | python -c "import sys,json; d=json.load(sys.stdin); assert d['decision']=='allow', f'Expected allow, got: {d}'"
          echo "check_dangerous_cmd.py allow OK"

      - name: Test check_dangerous_cmd.py — deny destructive command
        run: |
          result=$(echo '{"CommandLine": "rm -rf /"}' | python .agents/scripts/check_dangerous_cmd.py)
          echo "$result" | python -c "import sys,json; d=json.load(sys.stdin); assert d['decision']=='deny', f'Expected deny, got: {d}'"
          echo "check_dangerous_cmd.py deny OK"

      - name: Test pre_commit_secret_scan.py — allow safe content
        run: |
          result=$(echo '{"CodeContent": "x = 1 + 2"}' | python .agents/scripts/pre_commit_secret_scan.py)
          echo "$result" | python -c "import sys,json; d=json.load(sys.stdin); assert d['decision']=='allow', f'Expected allow, got: {d}'"
          echo "pre_commit_secret_scan.py allow OK"

      - name: Test pre_commit_secret_scan.py — deny hardcoded token
        run: |
          dummy_payload=$(python -c 'import json; print(json.dumps({"CodeContent": "token = " + "ghp_" + "0" * 36}))')
          result=$(echo "$dummy_payload" | python .agents/scripts/pre_commit_secret_scan.py)
          echo "$result" | python -c "import sys,json; d=json.load(sys.stdin); assert d['decision']=='deny', f'Expected deny, got: {d}'"
          echo "pre_commit_secret_scan.py deny OK"
