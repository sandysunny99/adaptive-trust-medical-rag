<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Research prototype for evidence-grounded medication safety analysis." />
    <title>Medical RAG · Medication Safety Research Prototype</title>
    <script>
      // Apply the stored or system theme before first paint (mirrors src/theme/theme.ts).
      (function () {
        var stored = null;
        try { stored = localStorage.getItem('medrag-theme'); } catch (e) {}
        var dark = stored === 'dark' || (stored !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
