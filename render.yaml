# Render Blueprint: one Docker web service (backend + built frontend on one URL).
# Keys are not stored here: Render asks for every "sync: false" value when the Blueprint is created.
services:
  - type: web
    name: adaptive-trust-medical-rag
    runtime: docker
    plan: standard            # 2 GB RAM; the NLI and embedding models do not fit in 512 MB
    region: singapore
    branch: claude/project-thread-q4qv1f
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health/ready
    autoDeploy: true
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_FALLBACK_PROVIDERS
        value: cloudflare
      - key: GROQ_API_KEY
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: NVIDIA_API_KEY      # vision fallback for prescription images
        sync: false
      - key: NVIDIA_OCR_MODEL
        value: nvidia/nemotron-3.5-super-vl-120b-a12b
