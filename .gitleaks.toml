# Gitleaks configuration for adaptive-trust-medical-rag
# 
# All findings below are confirmed false positives in third-party package
# internals inside the .venv/ directory. The virtual environment is never
# committed to git, but gitleaks --no-git scans the working tree including it.
#
# Resolution strategy:
#   1. Exclude the entire .venv/ directory (the primary fix — no code we own).
#   2. Exclude generated lock files and SBOM outputs.
#   3. Add rule-level allowlists for the generic-api-key rule on known FP paths.

title = "gitleaks config — adaptive-trust-medical-rag"

[extend]
# Inherit the default gitleaks ruleset
useDefault = true

# ── Global path excludes ──────────────────────────────────────────────────────
[allowlist]
description = "Exclude virtual environment, build artifacts, and generated files"
paths = [
    # Virtual environment — third-party code, never committed
    '''.venv[/\\]''',
    # Python bytecode
    '''__pycache__[/\\]''',
    '''\.pyc$''',
    # Alembic auto-generated migration scripts (reviewed separately)
    '''alembic[/\\]versions[/\\]''',
    # SBOM + scan outputs
    '''sbom\.spdx\.json''',
    '''trivy-results\.sarif''',
    '''gitleaks-report\.json''',
    # uv lock file — dependency hashes, not secrets
    '''uv\.lock''',
    # Node modules (if ever added)
    '''node_modules[/\\]''',
]
